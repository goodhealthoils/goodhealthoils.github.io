title: 90 Day Reset Challenge
hero: {image: assets/img/reset/hero.webp, url: "https://www.doterra.com/US/en/90-day-reset-challenge-participants"}
what_it_is:
  - The 90-Day Reset Challenge is a simple guided program designed to help you establish foundational wellness with proven doTERRA products and principles.
  - Rather than chasing symptoms or quick fixes like so many supposed health solutions, this Reset program focuses on meeting your body's root needs—nutrition, digestion, energy, and healthy elimination—while helping you build daily habits that support long-term wellness.*
  - Whether you're new to doTERRA or ready to recommit to your wellness routine, the 90-Day Reset meets you where you are and gives you a clear path forward.
  - You're just 90 days away from resetting your full bio terrain. Are you ready to start?
